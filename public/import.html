<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import Excel - Call of Dragons Stats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app-layout">
    <div id="sidebar"></div>
    <main class="main-content">
      <div class="page-header">
        <h2>Import Excel</h2>
        <p class="subtitle">Upload CoD Game Tools export (.xlsx)</p>
      </div>

      <div class="upload-zone" id="upload-zone">
        <div class="icon">📁</div>
        <p>Drag & drop Excel file here or click to browse</p>
        <p style="color:var(--text-muted);font-size:0.8rem;margin-top:0.5rem">
          Format: SERVER_STARTDATE_ENDDATE.xlsx
        </p>
        <input type="file" id="file-input" accept=".xlsx" hidden>
      </div>

      <div id="import-content"></div>
    </main>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
  <script src="/js/import.js"></script>
</body>
</html>
